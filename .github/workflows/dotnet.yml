# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

env:
  # Simple SemVer-ish versioning: MAJOR.MINOR is pinned here, BUILD increments per workflow run.
  VERSION_PREFIX: '0.1'

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build (${{ matrix.os }} ${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: Windows
            runsOn: windows-latest
            platform: win-x64
            needsX86DotnetRoot: false
          - os: Windows
            runsOn: windows-latest
            platform: win-x86
            needsX86DotnetRoot: true
          - os: Windows
            runsOn: windows-11-arm
            platform: win-arm64
            needsX86DotnetRoot: false
          - os: Linux
            runsOn: ubuntu-latest
            platform: linux-x64
            needsX86DotnetRoot: false
          - os: Linux
            runsOn: ubuntu-24.04-arm
            platform: linux-arm64
            needsX86DotnetRoot: false
          - os: MacOSX
            runsOn: macos-15-intel
            platform: osx-x64
            needsX86DotnetRoot: false
          - os: MacOSX
            runsOn: macos-latest
            platform: osx-arm64
            needsX86DotnetRoot: false
    runs-on: ${{ matrix.runsOn }}
    steps:
      - uses: actions/checkout@v7

      # Black magic for x86 .NET
      - name: Setup .NET x86 (Windows x86 workaround)
        if: ${{ matrix.needsX86DotnetRoot }}
        uses: actions/setup-dotnet@v5
        env:
          PROCESSOR_ARCHITECTURE: x86
          DOTNET_INSTALL_DIR: C:\Program Files (x86)\dotnet
        with:
          dotnet-version: 10.0.x
      - name: Set DOTNET_ROOT(x86)
        if: ${{ matrix.needsX86DotnetRoot }}
        shell: pwsh
        run: |
          "DOTNET_ROOT(x86)=${env:DOTNET_ROOT}" | Out-File -FilePath $env:GITHUB_ENV -Append
      # End of Black magic for x86 .NET    
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore ./P2KLPU.sln -r ${{ matrix.platform }} -p:MyRuntimeIdentifier=${{ matrix.platform }} -p:Version=${{ env.VERSION_PREFIX }}.${{ github.run_number }} -p:InformationalVersion=${{ env.VERSION_PREFIX }}.${{ github.run_number }}+${{ github.sha }} -p:PublishSingleFile=true -p:SelfContained=false -p:DebugSymbols=true -p:DebugType=portable
      - name: Build
        run: dotnet build -p:PublishSingleFile=true --self-contained false --no-restore -p:MyRuntimeIdentifier=${{ matrix.platform }} -p:Version=${{ env.VERSION_PREFIX }}.${{ github.run_number }} -p:InformationalVersion=${{ env.VERSION_PREFIX }}.${{ github.run_number }}+${{ github.sha }} --configuration Release -p:DebugSymbols=true -p:DebugType=portable
      - name: Test
        run: dotnet test --no-build -p:MyRuntimeIdentifier=${{ matrix.platform }} -p:Version=${{ env.VERSION_PREFIX }}.${{ github.run_number }} -p:InformationalVersion=${{ env.VERSION_PREFIX }}.${{ github.run_number }}+${{ github.sha }} --configuration Release --verbosity normal --logger trx --results-directory "TestResults-${{ matrix.os }}-${{ matrix.platform }}"

      - name: Test report (TRX)
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Tests - ${{ matrix.os }} - ${{ matrix.platform }}
          path: TestResults-${{ matrix.os }}-${{ matrix.platform }}/**/*.trx
          reporter: dotnet-trx
          use-actions-summary: 'true'
          list-suites: all
          list-tests: failed
          max-annotations: '10'

      - name: Publish
        run: dotnet publish ./P2KLPU.csproj -p:PublishSingleFile=true --self-contained false --no-restore -p:MyRuntimeIdentifier=${{ matrix.platform }} -p:Version=${{ env.VERSION_PREFIX }}.${{ github.run_number }} -p:InformationalVersion=${{ env.VERSION_PREFIX }}.${{ github.run_number }}+${{ github.sha }} --configuration Release -p:DebugSymbols=true -p:DebugType=portable --output ./Publish/${{ matrix.os }}/${{ matrix.platform }}

      - name: Collect symbols + strip from publish
        shell: pwsh
        run: |
          $publishDir = "./Publish/${{ matrix.os }}/${{ matrix.platform }}"
          $symbolsDir = "./Symbols/${{ matrix.os }}/${{ matrix.platform }}"

          New-Item -ItemType Directory -Force -Path $symbolsDir | Out-Null

          # Copy PDBs (portable symbols)
          Get-ChildItem -Path $publishDir -Recurse -File -Filter *.pdb | ForEach-Object {
            $rel = Resolve-Path -LiteralPath $_.FullName | ForEach-Object { $_.Path }
            Copy-Item -Force -LiteralPath $_.FullName -Destination $symbolsDir
          }

          # Copy macOS .dSYM bundles (directories)
          Get-ChildItem -Path $publishDir -Recurse -Directory | Where-Object { $_.Name.EndsWith('.dSYM', [System.StringComparison]::OrdinalIgnoreCase) } | ForEach-Object {
            Copy-Item -Recurse -Force -LiteralPath $_.FullName -Destination (Join-Path $symbolsDir $_.Name)
          }

          # Strip symbols from the publish output (end-user artifact)
          Get-ChildItem -Path $publishDir -Recurse -File -Filter *.pdb | Remove-Item -Force
          Get-ChildItem -Path $publishDir -Recurse -Directory | Where-Object { $_.Name.EndsWith('.dSYM', [System.StringComparison]::OrdinalIgnoreCase) } | Remove-Item -Recurse -Force

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: Symbols - v${{ env.VERSION_PREFIX }}.${{ github.run_number }} - ${{ matrix.os }} - ${{ matrix.platform }}
          path: ./Symbols/${{ matrix.os }}/${{ matrix.platform }}
      - name: Upload dotnet test results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: Unit Test Results - v${{ env.VERSION_PREFIX }}.${{ github.run_number }} - ${{ matrix.os }} - ${{ matrix.platform }}
          path: TestResults-${{ matrix.os }}-${{ matrix.platform }}
      - name: Upload build
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: P2KLPU - v${{ env.VERSION_PREFIX }}.${{ github.run_number }} - ${{ matrix.os }} - ${{ matrix.platform }}
          path: ./Publish/${{ matrix.os }}/${{ matrix.platform }}
